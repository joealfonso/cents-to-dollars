<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loud, pitch tool</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap">
<style>
body{margin:0}
a:hover{background:#FFFFFF;color:#0A0A0A}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #FFD60A; color: #0A0A0A; font-family: Archivo, system-ui, sans-serif; padding: 40px 64px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="#" style="background: #0A0A0A; color: #FFD60A; font-family: 'Archivo Black', sans-serif; font-size: 16px; padding: 10px 18px; text-decoration: none; border: 4px solid #0A0A0A">← BACK</a>
<span style="font-family: 'Archivo Black', sans-serif; font-size: 18px; background: #FF5BA7; border: 4px solid #0A0A0A; padding: 8px 16px; transform: rotate(2deg); box-shadow: 5px 5px 0 #0A0A0A">LISTENING</span>
</div>
<h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 56px; line-height: 0.95; text-transform: uppercase">Pitch + spectrogram</h1>
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: stretch; padding: 4px 8px 12px">
<div style="flex: 1 1 520px; min-width: 0; box-sizing: border-box; border: 4px solid #0A0A0A; background: #5B7CFF; box-shadow: 10px 10px 0 #0A0A0A; padding: 16px; transform: rotate(-0.8deg)">
<svg viewBox="0 0 640 360" role="img" aria-label="Spectrogram with a rising pitch trace" style="display: block; width: 100%"><rect width="640" height="360" fill="#0A0A0A"/><g fill="#FFD60A"><rect x="16" y="270" width="608" height="14" opacity="0.25"/><rect x="16" y="226" width="608" height="14" opacity="0.4"/><rect x="16" y="182" width="608" height="14" opacity="0.25"/><rect x="16" y="138" width="608" height="14" opacity="0.15"/><rect x="16" y="94" width="608" height="14" opacity="0.1"/></g><polyline points="16,300 90,268 160,262 230,214 300,208 370,170 440,174 510,138 580,142 624,124" fill="none" stroke="#FF5BA7" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
</div>
<div style="flex: 0 1 400px; min-width: 300px; display: flex; flex-direction: column; gap: 22px">
<div style="box-sizing: border-box; border: 4px solid #0A0A0A; background: #FFFFFF; box-shadow: 10px 10px 0 #0A0A0A; padding: 8px 20px 16px; transform: rotate(1.2deg)">
<div style="font-family: 'Archivo Black', sans-serif; font-size: 230px; line-height: 1; letter-spacing: -0.04em">A4</div>
<div style="display: inline-block; font-family: 'Archivo Black', sans-serif; font-size: 28px; background: #2EE59D; border: 4px solid #0A0A0A; padding: 6px 14px">+3 CENTS</div>
</div>
<a href="#" style="margin-top: auto; background: #0A0A0A; color: #FFD60A; font-family: 'Archivo Black', sans-serif; font-size: 28px; text-align: center; padding: 22px 24px; text-decoration: none; border: 4px solid #0A0A0A">STOP + SAVE →</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
